[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harness-lens"
version = "0.2.0"
description = "Observe agentic coding harnesses (Claude Code, Codex CLI), reconstruct Flow/Task/Step trajectories, and evolve external scaffolding via AHE."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "harness-lens" }]
keywords = ["agentic", "coding-agent", "claude-code", "codex", "observability", "hooks", "governance", "guardrails", "ahe"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Pillar 2/3 agents and the Layer-2 Judge call the Anthropic API.
agents = ["anthropic>=0.39"]
# The MCP server surface.
mcp = ["mcp>=1.2"]
# The control-plane daemon (FastAPI app, hook adapters, approval queue, JSONL tail).
daemon = ["fastapi>=0.110", "uvicorn>=0.27", "websockets>=12", "watchdog>=3"]
all = ["anthropic>=0.39", "mcp>=1.2", "fastapi>=0.110", "uvicorn>=0.27", "websockets>=12", "watchdog>=3"]

[project.scripts]
harness-lens = "harness_lens.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["harness_lens"]
